services:
  # 1. Backend Web API (ASP.NET Core on Docker, Free Tier)
  - type: web
    name: pushpakclasses-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      - key: EnableSwagger
        value: "true"
      - key: EnableHttpsRedirection
        value: "false"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: JwtSettings__Secret
        generateValue: true
      - key: SeedData__AdminUser__Email
        value: admin@example.com
      - key: SeedData__AdminUser__Password
        sync: false
      - key: RedisSettings__Enabled
        value: "false"
      - key: HangfireSettings__UseInMemory
        value: "true"
      - key: Cors__AllowedOrigins__0
        fromService:
          type: web
          name: pushpakclasses-web
          property: host

  # 2. Frontend SPA (Angular 22 Static Site on Global CDN, Free Tier)
  - type: web
    name: pushpakclasses-web
    runtime: static
    buildCommand: cd frontend/pushpak-classes && npm install && npm run build -- --configuration=production
    staticPublishPath: frontend/pushpak-classes/dist/pushpak-classes/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
