name: pushpakclasses

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pushpakclasses-sqlserver
    user: root
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-YourStrong@Passw0rd!}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD:-YourStrong@Passw0rd!}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: pushpakclasses-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: pushpakclasses-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING:-Server=sqlserver,1433;Database=PushpakClassesDb;User Id=sa;Password=${DB_PASSWORD:-YourStrong@Passw0rd!};TrustServerCertificate=True;MultipleActiveResultSets=False;Max Pool Size=1024;Connect Timeout=60;}
      - JwtSettings__Secret=${JWT_SECRET:-ReplaceWithYourSuperSecretJwtSigningKey32CharsMin!}
      - SeedData__AdminUser__Email=${ADMIN_EMAIL:-admin@example.com}
      - SeedData__AdminUser__Password=${ADMIN_PASSWORD:-ChangeMe123!}
      - CLEANUP_PROTECTED_EMAILS=${CLEANUP_PROTECTED_EMAILS:-admin@example.com,candidate@example.com}
      - RedisSettings__ConnectionString=${REDIS_CONNECTION:-redis:6379}
      - RedisSettings__Enabled=true
      - Cors__AllowedOrigins__0=http://localhost:4200
      - Cors__AllowedOrigins__1=http://localhost
      - Cors__AllowedOrigins__2=http://localhost:5139
      - EnableHttpsRedirection=false
      - EnableSwagger=true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  lb:
    image: nginx:alpine
    container_name: pushpakclasses-lb
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "5139:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/lb-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    image: pushpakclasses-web
    container_name: pushpakclasses-frontend
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - lb
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  sqlserver_data:
  redis_data:
  uploads_data:
