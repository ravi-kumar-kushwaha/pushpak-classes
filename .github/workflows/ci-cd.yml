name: PushpakClasses CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/PushpakClasses.sln

      - name: Build Solution
        run: dotnet build backend/PushpakClasses.sln --configuration Release --no-restore

      - name: Run Unit & Integration Tests
        run: dotnet test backend/PushpakClasses.UnitTests/PushpakClasses.UnitTests.csproj --configuration Release --no-build --verbosity normal

  frontend-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/pushpak-classes/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend/pushpak-classes
        run: npm ci

      - name: Run Angular Unit Tests
        working-directory: frontend/pushpak-classes
        run: npm run test -- --watch=false

      - name: Build Production Bundle
        working-directory: frontend/pushpak-classes
        run: npm run build -- --configuration=production

  docker-build:
    name: Docker Image Verification
    runs-on: ubuntu-latest
    needs: [ backend-test, frontend-test ]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: pushpakclasses-api:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: pushpakclasses-web:latest
